<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>Handleliste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#1d2320; --muted:#7a807c; --line:#e6e2d9;
    --accent:#1f6f4a; --accent-soft:#e3f0e8; --danger:#c2412d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --card:#1e2421; --ink:#eef1ef; --muted:#8e9792; --line:#2c3430;
      --accent:#4fb784; --accent-soft:#1f3329; --danger:#ef7a66; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 140px}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 2px 16px}
  h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.02em}
  .count{color:var(--muted);font-size:14px;margin-top:2px}
  .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--accent)} .dot.warn{background:#d9a13b}

  .group{margin-bottom:18px}
  .group h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 4px 8px;display:flex;gap:6px;align-items:center}
  ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;
    border:1px solid var(--line);overflow:hidden}
  li{display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;min-height:54px;
    border-top:1px solid var(--line);user-select:none}
  li:first-child{border-top:none}
  .check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
    display:grid;place-items:center;transition:all .15s}
  .check svg{opacity:0;transition:opacity .15s}
  li.done .check{background:var(--accent);border-color:var(--accent)}
  li.done .check svg{opacity:1}
  .main{flex:1;min-width:0;padding:14px 0;cursor:pointer}
  .name{font-size:16px;font-weight:500;overflow-wrap:anywhere}
  .qty{font-size:13px;color:var(--muted);margin-left:6px;font-weight:400}
  li.done .name{color:var(--muted);text-decoration:line-through}
  .del{flex:none;border:none;background:none;color:var(--muted);width:44px;height:44px;
    border-radius:10px;font-size:22px;cursor:pointer}
  .del:active{background:var(--line)}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-size:44px;margin-bottom:8px}

  .clear{display:block;margin:6px auto 0;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
  .clear:active{background:var(--line)}

  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);
    padding:24px 16px calc(14px + env(safe-area-inset-bottom))}
  .bar-inner{max-width:560px;margin:0 auto}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
    padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
  .chip:active{background:var(--accent-soft)}
  .suggest{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    margin-bottom:8px;box-shadow:0 6px 24px rgba(0,0,0,.10)}
  .suggest[hidden]{display:none}
  .sugg{display:flex;align-items:center;gap:10px;width:100%;border:none;border-top:1px solid var(--line);
    background:none;color:var(--ink);font:inherit;text-align:left;padding:12px 14px;cursor:pointer}
  .sugg:first-child{border-top:none}
  .sugg:active{background:var(--accent-soft)}
  .sugg-emoji{flex:none;width:22px;text-align:center}
  .sugg-name{font-weight:500}
  .sugg-cat{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  form{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  input{flex:1;min-width:0;border:none;background:none;color:var(--ink);font:inherit;font-size:16px;padding:10px}
  input:focus{outline:none}
  .add{flex:none;border:none;background:var(--accent);color:#fff;border-radius:12px;width:48px;height:44px;
    font-size:26px;cursor:pointer;display:grid;place-items:center}
  .add:disabled{opacity:.4}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;
    transition:all .2s;pointer-events:none;display:flex;gap:12px;align-items:center;z-index:5}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast button{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Handleliste</h1>
      <div class="count" id="count">&nbsp;</div>
    </div>
    
  </header>
  <main id="list"></main>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="suggest" id="suggest" hidden></div>
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Legg til vare, f.eks. «2 melk»" enterkeyhint="done" aria-label="Ny vare">
      <button class="add" id="addBtn" type="submit" aria-label="Legg til" disabled>+</button>
    </form>
  </div>
</div>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo" type="button">Angre</button></div>

<script src="products.js"></script>
<script>
// ---------- Kategorier (fra products.js) ----------
const CAT_ORDER = CATEGORIES.map(c=>c[0]);
const CAT_LABEL = Object.fromEntries(CATEGORIES);
const CAT_ALIAS = {torr:"middag"}; // eldre kategorinavn
const CAT_EMOJI = Object.fromEntries(CATEGORIES.map(([k,l])=>[k,l.split(" ")[0]]));
function normCat(c){ c=CAT_ALIAS[c]||c; return CAT_ORDER.includes(c)?c:"annet"; }
function guessCat(name){
  const key=name.toLowerCase().trim();
  if(CATALOG_BY_KEY[key]) return CATALOG_BY_KEY[key].cat;
  const words=key.split(/[\s,.\-\/]+/).filter(Boolean);
  // 1) helt ord som finnes i varelista ("økologisk melk" → melk)
  for(let i=words.length-1;i>=0;i--){ if(CATALOG_BY_KEY[words[i]]) return CATALOG_BY_KEY[words[i]].cat; }
  // 2) sammensatte ord ("sjokolademelk" → melk, "kyllingfiletstrimler" → kyllingfilet)
  // Siste del av et sammensatt ord bestemmer hva det er, så "endsWith" vinner over "startsWith"
  let best=null, bestScore=0;
  for(const w of words){
    for(const p of CATALOG){
      if(p.key.length<3||p.key.includes(" ")) continue;
      const sc = w.endsWith(p.key) ? 1000+p.key.length : (p.key.length>=4 && w.startsWith(p.key)) ? p.key.length : 0;
      if(sc>bestScore){ best=p; bestScore=sc; }
    }
  }
  return best?best.cat:"annet";
}

// ---------- Autofyll ----------
function fold(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function suggestions(q){
  q=fold(q.trim()); if(q.length<1) return [];
  const onList=new Set(Object.values(items).filter(it=>!it.done).map(it=>it.name.toLowerCase()));
  const pool=new Map();
  for(const p of CATALOG) pool.set(p.key,{name:p.name,cat:p.cat,n:0});
  for(const [k,v] of Object.entries(history)){
    const e=pool.get(k); if(e) e.n=v.n; else pool.set(k,{name:v.name,cat:guessCat(v.name),n:v.n});
  }
  const out=[];
  for(const [k,e] of pool){
    if(onList.has(k)) continue;
    const f=fold(e.name); let score;
    if(f===q) score=0; else if(f.startsWith(q)) score=1;
    else if(f.split(/[\s\-]+/).some(w=>w.startsWith(q))) score=2;
    else if(q.length>=3 && f.includes(q)) score=3; else continue;
    out.push({...e,score});
  }
  out.sort((a,b)=>a.score-b.score || b.n-a.n || a.name.length-b.name.length || a.name.localeCompare(b.name,"no"));
  return out.slice(0,6);
}
function renderSuggest(){
  const el=document.getElementById("suggest");
  if(!canWrite){ el.innerHTML=""; el.hidden=true; return; }
  const {name,qty}=parseInput(input.value);
  const list=input.value.trim()?suggestions(name):[];
  el.hidden=!list.length;
  document.getElementById("chips").style.display = input.value.trim() ? "none" : "";
  if(input.value.trim()===""){ renderChips(); }
  el.innerHTML=list.map(s=>`<button type="button" class="sugg" data-name="${esc(s.name)}" data-qty="${esc(qty)}">
    <span class="sugg-emoji">${CAT_EMOJI[s.cat]||"🛒"}</span><span class="sugg-name">${esc(s.name)}</span>${qty?`<span class="qty">${esc(qty)}</span>`:""}
    <span class="sugg-cat">${esc((CAT_LABEL[s.cat]||"").replace(/^\S+\s/,""))}</span></button>`).join("");
}

function parseInput(raw){
  let s = raw.trim().replace(/\s+/g," ");
  let qty = "";
  let m = s.match(/^(\d+[.,]?\d*\s?(?:stk|pk|kg|g|l|dl|liter|pakker?|bokser?|flasker?|poser?)?)\s+(.+)$/i);
  if(m){ qty=m[1]; s=m[2]; }
  else { m = s.match(/^(.+?)\s+[x×]?(\d+[.,]?\d*\s?(?:stk|pk|kg|g|l|dl)?)$/i); if(m){ s=m[1]; qty=m[2]; } }
  s = s.charAt(0).toUpperCase()+s.slice(1);
  return {name:s.slice(0,80), qty:qty.slice(0,20)};
}

// ---------- Lagring ----------
const LS_ITEMS="handleliste.items.v1", LS_HIST="handleliste.history.v1";
function lsGet(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

let items = {};           // id -> {name,qty,cat,done,createdAt}
let mode = "local";       // "local" | "db"
let col = null;
let canWrite = true;
let history = lsGet(LS_HIST,{}); // name -> count

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function setSync(){}

async function writeItem(id,data){
  if(mode==="db"){
    try{ await col.doc(id).set(data); }
    catch(e){ if(e&&e.code==="invalid_argument"){ canWrite=false; setSync("readonly"); render(); } else showToast("Kunne ikke lagre – prøv igjen", false); }
  } else { items[id]=data; lsSet(LS_ITEMS,items); render(); }
}
async function removeItem(id){
  if(mode==="db"){
    try{ await col.doc(id).delete(); }catch(e){ showToast("Kunne ikke slette", false); }
  } else { delete items[id]; lsSet(LS_ITEMS,items); render(); }
}

// ---------- Handlinger ----------
function addItem(raw){
  const {name,qty} = parseInput(raw);
  if(!name) return;
  // finnes den allerede (ikke avkrysset)? oppdater i stedet
  const existing = Object.entries(items).find(([,it])=>it.name.toLowerCase()===name.toLowerCase());
  const key = name.toLowerCase();
  history[key] = {name, n:((history[key]&&history[key].n)||0)+1};
  lsSet(LS_HIST,history);
  if(existing){
    const [id,it]=existing;
    writeItem(id,{...it, done:false, qty:qty||it.qty});
    if(mode==="db"){ items[id]={...it,done:false,qty:qty||it.qty}; render(); }
    return;
  }
  const id=uid();
  const data={name,qty,cat:guessCat(name),done:false,createdAt:Date.now()};
  if(mode==="db"){ items[id]=data; render(); }
  writeItem(id,data);
}
function toggle(id){
  const it=items[id]; if(!it||!canWrite) return;
  const data={...it, done:!it.done};
  if(mode==="db"){ items[id]=data; render(); }
  writeItem(id,data);
}
let lastRemoved=null;
function del(id){
  const it=items[id]; if(!it||!canWrite) return;
  lastRemoved=[[id,it]];
  if(mode==="db"){ delete items[id]; render(); }
  removeItem(id);
  showToast(`«${it.name}» fjernet`, true);
}
async function clearDone(){
  const done=Object.entries(items).filter(([,it])=>it.done);
  if(!done.length||!canWrite) return;
  lastRemoved=done;
  for(const [id] of done){
    if(mode==="db"){ delete items[id]; render(); }
    await removeItem(id);
  }
  showToast(`${done.length} ${done.length===1?"vare":"varer"} fjernet`, true);
}
async function undo(){
  hideToast();
  if(!lastRemoved) return;
  const batch=lastRemoved; lastRemoved=null;
  for(const [id,it] of batch){
    if(mode==="db"){ items[id]=it; render(); }
    await writeItem(id,it);
  }
}

// ---------- Toast ----------
let toastTimer;
function showToast(text, withUndo){
  document.getElementById("toastText").textContent=text;
  document.getElementById("undo").style.display=withUndo?"":"none";
  document.getElementById("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,4000);
}
function hideToast(){ document.getElementById("toast").classList.remove("show"); }
document.getElementById("undo").addEventListener("click",undo);

// ---------- Visning ----------
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function row(id,it){
  return `<li class="${it.done?"done":""}" data-id="${esc(id)}">
    <div class="check">${CHECK_SVG}</div>
    <div class="main" data-act="toggle"><span class="name">${esc(it.name)}</span>${it.qty?`<span class="qty">${esc(it.qty)}</span>`:""}</div>
    ${canWrite?`<button class="del" data-act="del" aria-label="Fjern ${esc(it.name)}">×</button>`:""}
  </li>`;
}

function render(){
  const all=Object.entries(items).filter(([,it])=>it&&typeof it.name==="string");
  const open=all.filter(([,it])=>!it.done), done=all.filter(([,it])=>it.done);
  document.getElementById("count").textContent = all.length
    ? `${open.length} igjen${done.length?` · ${done.length} i kurven`:""}` : "Tom liste";
  const el=document.getElementById("list");
  if(!all.length){
    el.innerHTML=`<div class="empty"><div class="big">🛒</div>Lista er tom.<br>Skriv inn noe du trenger nedenfor.</div>`;
  } else {
    let html="";
    const byCat={};
    for(const e of open){ const c=normCat(e[1].cat); (byCat[c]=byCat[c]||[]).push(e); }
    for(const c of CAT_ORDER){
      if(!byCat[c]) continue;
      byCat[c].sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
      html+=`<section class="group"><h2>${CAT_LABEL[c]}</h2><ul>${byCat[c].map(e=>row(...e)).join("")}</ul></section>`;
    }
    if(done.length){
      done.sort((a,b)=>a[1].name.localeCompare(b[1].name,"no"));
      html+=`<section class="group"><h2>✓ I kurven</h2><ul>${done.map(e=>row(...e)).join("")}</ul>
        ${canWrite?`<button class="clear" id="clearBtn">Fjern ${done.length} avkryssede</button>`:""}</section>`;
    }
    el.innerHTML=html;
    const cb=document.getElementById("clearBtn"); if(cb) cb.onclick=clearDone;
  }
  renderChips();
  document.getElementById("input").disabled=!canWrite;
  document.getElementById("input").placeholder=canWrite?"Legg til vare, f.eks. «2 melk»":"Du har bare lesetilgang";
}

function renderChips(){
  const onList=new Set(Object.values(items).filter(it=>!it.done).map(it=>it.name.toLowerCase()));
  const sugg=Object.entries(history).filter(([k])=>!onList.has(k))
    .sort((a,b)=>b[1].n-a[1].n).slice(0,12);
  const el=document.getElementById("chips");
  el.innerHTML = canWrite ? sugg.map(([k,v])=>`<button class="chip" data-name="${esc(v.name)}">+ ${esc(v.name)}</button>`).join("") : "";
  el.style.display=sugg.length&&canWrite&&!input.value.trim()?"":"none";
}

document.getElementById("list").addEventListener("click",e=>{
  const act=e.target.closest("[data-act]"); const li=e.target.closest("li");
  if(!li) return;
  const id=li.dataset.id;
  if(act&&act.dataset.act==="del") del(id);
  else toggle(id);
});
document.getElementById("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(b) addItem(b.dataset.name);
});
const input=document.getElementById("input"), addBtn=document.getElementById("addBtn");
input.addEventListener("input",()=>{ addBtn.disabled=!input.value.trim(); renderSuggest(); });
document.getElementById("suggest").addEventListener("click",e=>{
  const b=e.target.closest(".sugg"); if(!b) return;
  addItem((b.dataset.qty?b.dataset.qty+" ":"")+b.dataset.name);
  input.value=""; addBtn.disabled=true; renderSuggest(); input.focus();
});
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  if(!input.value.trim()) return;
  addItem(input.value); input.value=""; addBtn.disabled=true; renderSuggest(); input.focus();
});

// ---------- Oppstart ----------
items = lsGet(LS_ITEMS,{});
render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
