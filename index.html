<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<meta name="color-scheme" content="light dark">
<title>Handleliste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{ color-scheme:light dark;
    --bg:#f5f3ee; --card:#ffffff; --ink:#1d2320; --muted:#7a807c; --line:#e6e2d9;
    --accent:#1f6f4a; --accent-soft:#e3f0e8; --danger:#c2412d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --card:#1e2421; --ink:#eef1ef; --muted:#8e9792; --line:#2c3430;
      --accent:#4fb784; --accent-soft:#1f3329; --danger:#ef7a66; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;overflow-x:hidden;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px}
  /* --fbt/--fbb: reserveplass når telefonen tegner appen bak status- og navigasjonslinjen uten å oppgi hvor store de er */
  body{padding:calc(env(safe-area-inset-top) + var(--fbt,0px)) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 140px}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 2px 16px}
  h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.02em}
  .count{color:var(--muted);font-size:14px;margin-top:2px}
  .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--accent)} .dot.warn{background:#d9a13b}

  .group{margin-bottom:18px}
  .group h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 4px 8px;display:flex;gap:6px;align-items:center}
  ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;
    border:1px solid var(--line);overflow:hidden}
  li{display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;min-height:54px;
    border-top:1px solid var(--line);user-select:none}
  li:first-child{border-top:none}
  .check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;
    display:grid;place-items:center;transition:all .15s;cursor:pointer;position:relative}
  .check::after{content:"";position:absolute;inset:-14px}
  li.open{background:var(--accent-soft)}
  li{-webkit-touch-callout:none}
  li.editing{background:var(--accent-soft);padding:6px 6px 6px 10px;gap:8px}
  .rename{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--card);
    border:2px solid var(--accent);border-radius:10px;padding:10px 12px}
  .rename:focus{outline:none}
  .savebtn{flex:none;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;height:44px;
    font:inherit;font-weight:600;cursor:pointer}
  .stepper{flex:none;display:flex;align-items:center;gap:4px}
  .stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font:inherit;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
  .stepper button:active{background:var(--line)}
  .stepper button:disabled{opacity:.35}
  .pill{flex:none;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;
    border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  li.done .pill{background:none;color:var(--muted)}
  .sq{min-width:34px;text-align:center;font-weight:600;font-size:15px}
  .check svg{opacity:0;transition:opacity .15s}
  li.done .check{background:var(--accent);border-color:var(--accent)}
  li.done .check svg{opacity:1}
  .main{flex:1;min-width:0;padding:14px 0;cursor:pointer}
  .name{font-size:16px;font-weight:500;overflow-wrap:anywhere}
  .qty{font-size:13px;color:var(--muted);margin-left:6px;font-weight:400}
  li.done .name{color:var(--muted);text-decoration:line-through}
  .del{flex:none;border:none;background:none;color:var(--muted);width:44px;height:44px;
    border-radius:10px;font-size:22px;cursor:pointer}
  .del:active{background:var(--line)}

  .ver{text-align:center;color:var(--muted);font-size:11px;opacity:.7;margin-top:18px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-size:44px;margin-bottom:8px}

  .clear{display:block;margin:6px auto 0;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
  .clear:active{background:var(--line)}

  .bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);
    padding:24px 16px calc(14px + env(safe-area-inset-bottom) + var(--fbb,0px))}
  .bar-inner{max-width:560px;margin:0 auto}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
    padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
  .chip:active{background:var(--accent-soft)}
  .suggest{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    margin-bottom:8px;box-shadow:0 6px 24px rgba(0,0,0,.10)}
  .suggest[hidden]{display:none}
  .sugg{display:flex;align-items:center;gap:10px;width:100%;border:none;border-top:1px solid var(--line);
    background:none;color:var(--ink);font:inherit;text-align:left;padding:12px 14px;cursor:pointer}
  .sugg:first-child{border-top:none}
  .sugg:active{background:var(--accent-soft)}
  .sugg-emoji{flex:none;width:22px;text-align:center}
  .sugg-name{font-weight:500}
  .sugg-cat{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  form{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  input{flex:1;min-width:0;border:none;background:none;color:var(--ink);font:inherit;font-size:16px;padding:10px}
  input:focus{outline:none}
  .add{flex:none;border:none;background:var(--accent);color:#fff;border-radius:12px;width:48px;height:44px;
    font-size:26px;cursor:pointer;display:grid;place-items:center}
  .add:disabled{opacity:.4}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

  .sortbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
    padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .sortbtn[hidden]{display:none}
  .hbtns{display:flex;gap:8px}
  .field{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .field:focus{outline:2px solid var(--accent);outline-offset:-1px}
  textarea.field{min-height:180px;resize:vertical;font-size:14px;line-height:1.45;font-family:ui-monospace,monospace}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:12px;
    padding:14px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:8px;text-decoration:none}
  .bigbtn.primary{background:var(--accent);color:#fff}
  .bigbtn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .chk{display:flex;align-items:center;gap:10px;margin:2px 4px 12px;font-size:15px}
  .chk{justify-content:flex-start}
  .chk input{flex:none;width:20px;height:20px;padding:0;margin:0;accent-color:var(--accent)}
  .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:1px 7px;min-width:20px;text-align:center}
  .badge:empty{display:none}
  .h2link{margin-left:auto;border:none;background:none;color:var(--accent);font:inherit;font-size:12px;
    font-weight:600;letter-spacing:.02em;text-transform:none;cursor:pointer;padding:4px 0}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
  .sheet-bg[hidden]{display:none}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:85vh;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
  .sheet-head h3{margin:0;font-size:20px}
  .sheet-close{border:none;background:var(--line);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer}
  .sheet-body{overflow-y:auto;padding:0 16px 24px}
  .sheet-body h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 4px 8px}
  .sheet-body p{color:var(--muted);font-size:14px;margin:4px 4px 10px;line-height:1.4}
  .srow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;min-height:56px;border-top:1px solid var(--line)}
  .srow:first-child{border-top:none}
  .srow .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
  .srow select{flex:none;max-width:52%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:8px}
  .srow .x{flex:none;border:none;background:none;color:var(--muted);width:36px;height:40px;font-size:20px;cursor:pointer}
  .sheet-actions{display:flex;gap:8px;margin-top:14px}
  .sheet-actions button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
    padding:12px;font:inherit;font-size:14px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;
    transition:all .2s;pointer-events:none;display:flex;gap:12px;align-items:center;z-index:5}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast button{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Handleliste</h1>
      <div class="count" id="count">&nbsp;</div>
    </div>
    <div class="hbtns">
      <button class="sortbtn" id="sortBtn" type="button" hidden>Sorter <span class="badge" id="sortBadge"></span></button>
      <button class="sortbtn" id="shareBtn" type="button" hidden aria-label="Del eller send lista">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Del</button>
    </div>
  </header>
  <main id="list"></main>
  <div class="ver" id="ver"></div>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="suggest" id="suggest" hidden></div>
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Legg til vare, f.eks. «2 melk»" enterkeyhint="done" aria-label="Ny vare">
      <button class="add" id="addBtn" type="submit" aria-label="Legg til" disabled>+</button>
    </form>
  </div>
</div>
<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle">Sorter varer</h3>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Lukk">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo" type="button">Angre</button></div>

<script src="products.js"></script>
<script>
// ---------- Kategorier (fra products.js) ----------
const CAT_ORDER = CATEGORIES.map(c=>c[0]);
const CAT_LABEL = Object.fromEntries(CATEGORIES);
const CAT_ALIAS = {torr:"middag"}; // eldre kategorinavn
const CAT_EMOJI = Object.fromEntries(CATEGORIES.map(([k,l])=>[k,l.split(" ")[0]]));
function normCat(c){ c=CAT_ALIAS[c]||c; return CAT_ORDER.includes(c)?c:"annet"; }
function guessCat(name){
  const key=name.toLowerCase().trim();
  if(customCats[key]) return normCat(customCats[key]);
  if(CATALOG_BY_KEY[key]) return CATALOG_BY_KEY[key].cat;
  const words=key.split(/[\s,.\-\/]+/).filter(Boolean);
  // 1) helt ord som finnes i varelista ("økologisk melk" → melk)
  for(let i=words.length-1;i>=0;i--){ if(CATALOG_BY_KEY[words[i]]) return CATALOG_BY_KEY[words[i]].cat; }
  // 2) sammensatte ord ("sjokolademelk" → melk, "kyllingfiletstrimler" → kyllingfilet)
  // Siste del av et sammensatt ord bestemmer hva det er, så "endsWith" vinner over "startsWith"
  let best=null, bestScore=0;
  for(const w of words){
    for(const p of CATALOG){
      if(p.key.length<3||p.key.includes(" ")) continue;
      const sc = w.endsWith(p.key) ? 1000+p.key.length : (p.key.length>=4 && w.startsWith(p.key)) ? p.key.length : 0;
      if(sc>bestScore){ best=p; bestScore=sc; }
    }
  }
  return best?best.cat:"annet";
}

// ---------- Autofyll ----------
function fold(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function suggestions(q){
  q=fold(q.trim()); if(q.length<1) return [];
  const onList=new Set(Object.values(items).filter(it=>!it.done).map(it=>it.name.toLowerCase()));
  const pool=new Map();
  for(const p of CATALOG) pool.set(p.key,{name:p.name,cat:p.cat,n:0});
  for(const [k,v] of Object.entries(history)){
    const e=pool.get(k); if(e) e.n=v.n; else pool.set(k,{name:v.name,cat:guessCat(v.name),n:v.n});
  }
  for(const [k,c] of Object.entries(customCats)){ const e=pool.get(k); if(e) e.cat=normCat(c); }
  const out=[];
  for(const [k,e] of pool){
    if(onList.has(k)) continue;
    const f=fold(e.name); let score;
    if(f===q) score=0; else if(f.startsWith(q)) score=1;
    else if(f.split(/[\s\-]+/).some(w=>w.startsWith(q))) score=2;
    else if(q.length>=3 && f.includes(q)) score=3; else continue;
    out.push({...e,score});
  }
  out.sort((a,b)=>a.score-b.score || b.n-a.n || a.name.length-b.name.length || a.name.localeCompare(b.name,"no"));
  return out.slice(0,6);
}
function renderSuggest(){
  const el=document.getElementById("suggest");
  if(!canWrite){ el.innerHTML=""; el.hidden=true; return; }
  const {name,qty}=parseInput(input.value);
  const list=input.value.trim()?suggestions(name):[];
  el.hidden=!list.length;
  document.getElementById("chips").style.display = input.value.trim() ? "none" : "";
  if(input.value.trim()===""){ renderChips(); }
  el.innerHTML=list.map(s=>`<button type="button" class="sugg" data-name="${esc(s.name)}" data-qty="${esc(qty)}">
    <span class="sugg-emoji">${CAT_EMOJI[s.cat]||"🛒"}</span><span class="sugg-name">${esc(s.name)}</span>${qty?`<span class="qty">${esc(qty)}</span>`:""}
    <span class="sugg-cat">${esc((CAT_LABEL[s.cat]||"").replace(/^\S+\s/,""))}</span></button>`).join("");
}

function parseInput(raw){
  let s = raw.trim().replace(/\s+/g," ");
  let qty = "";
  let m = s.match(/^(\d+[.,]?\d*\s?(?:stk|pk|kg|g|l|dl|liter|pakker?|bokser?|flasker?|poser?)?)\s+(.+)$/i);
  if(m){ qty=m[1]; s=m[2]; }
  else { m = s.match(/^(.+?)\s+[x×]?(\d+[.,]?\d*\s?(?:stk|pk|kg|g|l|dl)?)$/i); if(m){ s=m[1]; qty=m[2]; } }
  s = s.charAt(0).toUpperCase()+s.slice(1);
  return {name:s.slice(0,80), qty:qty.slice(0,20)};
}

// ---------- Lagring ----------
const LS_ITEMS="handleliste.items.v1", LS_HIST="handleliste.history.v1";
const LS_CUSTOM="handleliste.customcats.v1", LS_UNCAT="handleliste.uncategorized.v1";
function lsGet(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

let items = {};           // id -> {name,qty,cat,done,createdAt}
let mode = "local";       // "local" | "db"
let col = null;
let canWrite = true;
let history = lsGet(LS_HIST,{}); // name -> count
let customCats = lsGet(LS_CUSTOM,{}); // varenavn (små bokstaver) -> kategori du har valgt selv
let uncat = lsGet(LS_UNCAT,{});       // varenavn -> {name, n} som havnet i «Annet»

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function setSync(){}

async function writeItem(id,data){
  if(mode==="db"){
    try{ await col.doc(id).set(data); }
    catch(e){ if(e&&e.code==="invalid_argument"){ canWrite=false; setSync("readonly"); render(); } else showToast("Kunne ikke lagre – prøv igjen", false); }
  } else { items[id]=data; lsSet(LS_ITEMS,items); render(); }
}
async function removeItem(id){
  if(mode==="db"){
    try{ await col.doc(id).delete(); }catch(e){ showToast("Kunne ikke slette", false); }
  } else { delete items[id]; lsSet(LS_ITEMS,items); render(); }
}

// ---------- Handlinger ----------
function addItem(raw){
  const {name,qty} = parseInput(raw);
  if(!name) return;
  // finnes den allerede (ikke avkrysset)? oppdater i stedet
  const existing = Object.entries(items).find(([,it])=>it.name.toLowerCase()===name.toLowerCase());
  const key = name.toLowerCase();
  history[key] = {name, n:((history[key]&&history[key].n)||0)+1};
  lsSet(LS_HIST,history);
  if(existing){
    const [id,it]=existing;
    writeItem(id,{...it, done:false, qty:qty||it.qty});
    if(mode==="db"){ items[id]={...it,done:false,qty:qty||it.qty}; render(); }
    return;
  }
  const id=uid();
  const data={name,qty,cat:guessCat(name),done:false,createdAt:Date.now()};
  if(data.cat==="annet" && !customCats[key]){
    uncat[key]={name, n:((uncat[key]&&uncat[key].n)||0)+1}; lsSet(LS_UNCAT,uncat);
  }
  if(mode==="db"){ items[id]=data; render(); }
  writeItem(id,data);
}
function toggle(id){
  const it=items[id]; if(!it||!canWrite) return;
  const data={...it, done:!it.done};
  if(mode==="db"){ items[id]=data; render(); }
  writeItem(id,data);
}
let lastRemoved=null;
function del(id){
  const it=items[id]; if(!it||!canWrite) return;
  lastRemoved=[[id,it]];
  if(mode==="db"){ delete items[id]; render(); }
  removeItem(id);
  showToast(`«${it.name}» fjernet`, true);
}
async function clearDone(){
  const done=Object.entries(items).filter(([,it])=>it.done);
  if(!done.length||!canWrite) return;
  lastRemoved=done;
  for(const [id] of done){
    if(mode==="db"){ delete items[id]; render(); }
    await removeItem(id);
  }
  showToast(`${done.length} ${done.length===1?"vare":"varer"} fjernet`, true);
}
async function undo(){
  hideToast();
  if(!lastRemoved) return;
  const batch=lastRemoved; lastRemoved=null;
  for(const [id,it] of batch){
    if(mode==="db"){ items[id]=it; render(); }
    await writeItem(id,it);
  }
}

// ---------- Toast ----------
let toastTimer;
function showToast(text, withUndo){
  document.getElementById("toastText").textContent=text;
  document.getElementById("undo").style.display=withUndo?"":"none";
  document.getElementById("toast").classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,4000);
}
function hideToast(){ document.getElementById("toast").classList.remove("show"); }
document.getElementById("undo").addEventListener("click",undo);

// ---------- Visning ----------
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

let expanded=null; // id til varen som viser + / −
function splitQty(q){
  const m=String(q||"").trim().match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  return m ? {n:parseFloat(m[1].replace(",",".")), unit:m[2]} : {n:0, unit:String(q||"").trim()};
}
function qtyStep(unit){ const u=unit.toLowerCase(); return u==="g"?100 : (u==="kg"||u==="l"||u==="liter")?0.5 : 1; }
function fmtQty(n,unit){
  if(n<=0) return unit && !/^(stk|pk)$/i.test(unit) ? "" : "";
  const num=String(Math.round(n*10)/10).replace(".",",");
  return unit ? `${num} ${unit}` : num;
}
function changeQty(id,dir){
  const it=items[id]; if(!it||!canWrite) return;
  const {n,unit}=splitQty(it.qty); const step=qtyStep(unit);
  let next = (n||(dir>0?(unit?0:1):0)) + dir*step;
  if(n===0 && dir>0 && !unit) next=2;           // ingen antall = 1 stk, + gir 2
  if(dir<0 && n<=step) next=0;                    // ned til «ingen antall»
  const data={...it, qty: next>0 ? fmtQty(next,unit) : (unit&&!/^(stk|pk)$/i.test(unit)?"":"")};
  if(mode==="db"){ items[id]=data; render(); }
  writeItem(id,data);
}
let editing=null; // id til varen som får nytt navn
function row(id,it){
  if(editing===id && canWrite){
    return `<li class="editing" data-id="${esc(id)}">
      <input class="rename" id="renameInput" value="${esc(it.name)}" maxlength="80" enterkeyhint="done" aria-label="Nytt navn for ${esc(it.name)}">
      <button class="savebtn" data-act="save" type="button">Lagre</button>
    </li>`;
  }
  const open = expanded===id && canWrite;
  const {n}=splitQty(it.qty);
  return `<li class="${it.done?"done":""}${open?" open":""}" data-id="${esc(id)}">
    <button class="check" data-act="toggle" type="button" aria-label="${it.done?"Fjern avkrysning for":"Kryss av"} ${esc(it.name)}">${CHECK_SVG}</button>
    <div class="main" data-act="expand"><span class="name">${esc(it.name)}</span></div>
    ${it.qty&&!open?`<span class="pill" data-act="expand">${esc(/^\d+([.,]\d+)?$/.test(it.qty.trim())?it.qty.trim()+" stk":it.qty)}</span>`:""}
    ${open?`<div class="stepper">
      <button type="button" data-act="dec" aria-label="Færre" ${n?"":"disabled"}>−</button>
      <span class="sq">${esc(it.qty||"1")}</span>
      <button type="button" data-act="inc" aria-label="Flere">+</button></div>`:""}
    ${canWrite?`<button class="del" data-act="del" aria-label="Fjern ${esc(it.name)}">×</button>`:""}
  </li>`;
}

function render(){
  const all=Object.entries(items).filter(([,it])=>it&&typeof it.name==="string");
  const open=all.filter(([,it])=>!it.done), done=all.filter(([,it])=>it.done);
  document.getElementById("count").textContent = all.length
    ? `${open.length} igjen${done.length?` · ${done.length} i kurven`:""}` : "Tom liste";
  const el=document.getElementById("list");
  if(!all.length){
    el.innerHTML=`<div class="empty"><div class="big">🛒</div>Lista er tom.<br>Skriv inn noe du trenger nedenfor.</div>`;
  } else {
    let html="";
    const byCat={};
    for(const e of open){ const c=normCat(e[1].cat); (byCat[c]=byCat[c]||[]).push(e); }
    for(const c of CAT_ORDER){
      if(!byCat[c]) continue;
      byCat[c].sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
      html+=`<section class="group"><h2>${CAT_LABEL[c]}${c==="annet"&&canWrite?`<button class="h2link" data-open-sort type="button">Velg kategori →</button>`:""}</h2><ul>${byCat[c].map(e=>row(...e)).join("")}</ul></section>`;
    }
    if(done.length){
      done.sort((a,b)=>a[1].name.localeCompare(b[1].name,"no"));
      html+=`<section class="group"><h2>✓ I kurven</h2><ul>${done.map(e=>row(...e)).join("")}</ul>
        ${canWrite?`<button class="clear" id="clearBtn">Fjern ${done.length} avkryssede</button>`:""}</section>`;
    }
    el.innerHTML=html;
    const cb=document.getElementById("clearBtn"); if(cb) cb.onclick=clearDone;
  }
  renderChips();
  renderSortBtn();
  const ri=document.getElementById("renameInput");
  if(ri && document.activeElement!==ri){ ri.focus(); ri.select(); }
  if(typeof renderShareBtn==="function") renderShareBtn();
  document.getElementById("input").disabled=!canWrite;
  document.getElementById("input").placeholder=canWrite?"Legg til vare, f.eks. «2 melk»":"Du har bare lesetilgang";
}

function renderChips(){
  const onList=new Set(Object.values(items).filter(it=>!it.done).map(it=>it.name.toLowerCase()));
  const sugg=Object.entries(history).filter(([k])=>!onList.has(k))
    .sort((a,b)=>b[1].n-a[1].n).slice(0,12);
  const el=document.getElementById("chips");
  el.innerHTML = canWrite ? sugg.map(([k,v])=>`<button class="chip" data-name="${esc(v.name)}">+ ${esc(v.name)}</button>`).join("") : "";
  el.style.display=sugg.length&&canWrite&&!input.value.trim()?"":"none";
}

document.getElementById("list").addEventListener("click",e=>{
  const act=e.target.closest("[data-act]"); const li=e.target.closest("li");
  if(!li) return;
  const id=li.dataset.id;
  const a=act&&act.dataset.act;
  if(suppressClick){ suppressClick=false; return; }
  if(li.classList.contains("editing")){ if(a==="save") saveRename(); return; }
  if(a==="del"){ if(expanded===id) expanded=null; del(id); }
  else if(a==="toggle"){ expanded=null; toggle(id); }
  else if(a==="inc") changeQty(id,1);
  else if(a==="dec") changeQty(id,-1);
  else if(a==="expand"&&canWrite){ expanded = expanded===id ? null : id; render(); }
});
document.getElementById("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(b) addItem(b.dataset.name);
});
const input=document.getElementById("input"), addBtn=document.getElementById("addBtn");
input.addEventListener("input",()=>{ addBtn.disabled=!input.value.trim(); renderSuggest(); });
document.getElementById("suggest").addEventListener("click",e=>{
  const b=e.target.closest(".sugg"); if(!b) return;
  addItem((b.dataset.qty?b.dataset.qty+" ":"")+b.dataset.name);
  input.value=""; addBtn.disabled=true; renderSuggest(); input.focus();
});
document.getElementById("form").addEventListener("submit",e=>{
  e.preventDefault();
  if(!input.value.trim()) return;
  expanded=null; addItem(input.value); input.value=""; addBtn.disabled=true; renderSuggest(); input.focus();
});

// ---------- Sortering av «Annet» ----------
function catOptions(sel){
  return `<option value="" ${sel?"":"selected"} disabled>Velg kategori…</option>`+
    CATEGORIES.filter(([k])=>k!=="annet").map(([k,l])=>`<option value="${k}" ${k===sel?"selected":""}>${esc(l)}</option>`).join("")+
    `<option value="annet" ${sel==="annet"?"selected":""}>🛒 Behold i Annet</option>`;
}
function renderSortBtn(){
  const n=Object.keys(uncat).length;
  const btn=document.getElementById("sortBtn");
  btn.hidden = !canWrite || (n===0 && Object.keys(customCats).length===0);
  document.getElementById("sortBadge").textContent = n||"";
}
function renderSheet(){
  const un=Object.entries(uncat).sort((a,b)=>b[1].n-a[1].n||a[1].name.localeCompare(b[1].name,"no"));
  const mine=Object.entries(customCats).sort((a,b)=>a[0].localeCompare(b[0],"no"));
  const nameOf=k=>(uncat[k]&&uncat[k].name)||(history[k]&&history[k].name)||(k.charAt(0).toUpperCase()+k.slice(1));
  let h="";
  h+=`<h4>Ikke sortert (${un.length})</h4>`;
  if(un.length){
    h+=`<p>Varer appen ikke kjente igjen. Velg kategori én gang, så husker appen det neste gang.</p><ul>`+
      un.map(([k,v])=>`<li class="srow" data-key="${esc(k)}"><span class="nm">${esc(v.name)}</span>
        <select data-key="${esc(k)}" aria-label="Kategori for ${esc(v.name)}">${catOptions("")}</select>
        <button class="x" data-forget="${esc(k)}" type="button" aria-label="Fjern fra lista">×</button></li>`).join("")+`</ul>`;
  } else h+=`<p>Alt er sortert 🎉</p>`;
  if(mine.length){
    h+=`<h4>Dine kategorier (${mine.length})</h4><p>Varer du har sortert selv. Du kan endre dem her.</p><ul>`+
      mine.map(([k,c])=>`<li class="srow"><span class="nm">${esc(nameOf(k))}</span>
        <select data-key="${esc(k)}" aria-label="Kategori for ${esc(nameOf(k))}">${catOptions(normCat(c))}</select>
        <button class="x" data-unlearn="${esc(k)}" type="button" aria-label="Glem kategori">×</button></li>`).join("")+`</ul>
      <div class="sheet-actions"><button type="button" id="copyCats">Kopier som tekst</button></div>
      <p>Send teksten til Claude, så kan varene bygges inn i varelista for godt.</p>`;
  }
  document.getElementById("sheetBody").innerHTML=h;
  const cp=document.getElementById("copyCats");
  if(cp) cp.onclick=async()=>{
    const txt=mine.map(([k,c])=>`${nameOf(k)} → ${(CAT_LABEL[normCat(c)]||"").replace(/^\S+\s/,"")}`).join("\n");
    try{ await navigator.clipboard.writeText(txt); showToast("Kopiert",false); }catch(e){ showToast("Kunne ikke kopiere",false); }
  };
}
function openSheet(){ document.getElementById("sheetTitle").textContent="Sorter varer"; renderSheet(); document.getElementById("sheetBg").hidden=false; }
function closeSheet(){ document.getElementById("sheetBg").hidden=true; }
function setCategory(key,cat){
  const name=(uncat[key]&&uncat[key].name)||key;
  customCats[key]=cat; lsSet(LS_CUSTOM,customCats);
  delete uncat[key]; lsSet(LS_UNCAT,uncat);
  // flytt varer som står på lista nå
  for(const [id,it] of Object.entries(items)){
    if(it.name.toLowerCase()===key && normCat(it.cat)!==cat) writeItem(id,{...it,cat});
  }
  render(); renderSheet();
  if(cat!=="annet") showToast(`«${name}» → ${(CAT_LABEL[cat]||"").replace(/^\S+\s/,"")}`,false);
}
document.getElementById("sortBtn").addEventListener("click",openSheet);
document.getElementById("list").addEventListener("click",e=>{ if(e.target.closest("[data-open-sort]")){ e.stopPropagation(); openSheet(); } },true);
document.getElementById("sheetClose").addEventListener("click",closeSheet);
document.getElementById("sheetBg").addEventListener("click",e=>{ if(e.target.id==="sheetBg") closeSheet(); });
document.getElementById("sheetBody").addEventListener("change",e=>{
  const sel=e.target.closest("select[data-key]"); if(sel&&sel.value) setCategory(sel.dataset.key,sel.value);
});
document.getElementById("sheetBody").addEventListener("click",e=>{
  const f=e.target.closest("[data-forget]"); const u=e.target.closest("[data-unlearn]");
  if(f){ delete uncat[f.dataset.forget]; lsSet(LS_UNCAT,uncat); renderSheet(); renderSortBtn(); }
  if(u){ delete customCats[u.dataset.unlearn]; lsSet(LS_CUSTOM,customCats); renderSheet(); renderSortBtn(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

// Trykk utenfor en åpen vare lukker + / −
document.addEventListener("click",e=>{
  if(!expanded) return;
  const li=e.target.closest("li[data-id]");
  if(li && li.dataset.id===expanded) return;
  if(li) return; // en annen vare – lista håndterer det selv
  expanded=null; render();
});

// ---------- Hold inne for å endre navn ----------
let pressTimer=null, pressStart=null, suppressClick=false;
function startRename(id){
  if(!canWrite||!items[id]) return;
  expanded=null; editing=id;
  try{ navigator.vibrate&&navigator.vibrate(15); }catch(e){}
  render();
}
function saveRename(){
  const id=editing; if(!id) return;
  const ri=document.getElementById("renameInput");
  const it=items[id]; editing=null;
  if(!ri||!it){ render(); return; }
  const nn=ri.value.trim().replace(/\s+/g," ");
  if(!nn || nn===it.name){ render(); return; }
  const name=nn.charAt(0).toUpperCase()+nn.slice(1);
  const oldKey=it.name.toLowerCase(), newKey=name.toLowerCase();
  // skrivefeilen skal ikke dukke opp som forslag eller i «Ikke sortert»
  if(history[oldKey]){ const n=history[oldKey].n; delete history[oldKey]; history[newKey]={name,n:Math.max(n,(history[newKey]&&history[newKey].n)||0)}; lsSet(LS_HIST,history); }
  if(uncat[oldKey]){ delete uncat[oldKey]; lsSet(LS_UNCAT,uncat); }
  const cat=guessCat(name);
  if(cat==="annet" && !customCats[newKey]){ uncat[newKey]={name,n:1}; lsSet(LS_UNCAT,uncat); }
  const data={...it,name,cat};
  if(mode==="db"){ items[id]=data; render(); }
  writeItem(id,data);
  showToast(`Endret til «${name}»`,false);
}
function cancelRename(){ editing=null; render(); }
const listEl=document.getElementById("list");
listEl.addEventListener("pointerdown",e=>{
  suppressClick=false; // et nytt trykk – ikke svelg det
  const li=e.target.closest("li[data-id]");
  if(!li||li.classList.contains("editing")||e.target.closest("button")) return;
  pressStart={x:e.clientX,y:e.clientY};
  clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{ pressTimer=null; suppressClick=true; startRename(li.dataset.id); },500);
});
const cancelPress=e=>{
  if(!pressTimer) return;
  if(e.type==="pointermove" && pressStart && Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)<10) return;
  clearTimeout(pressTimer); pressTimer=null;
};
["pointerup","pointercancel","pointerleave","pointermove"].forEach(t=>listEl.addEventListener(t,cancelPress));
listEl.addEventListener("contextmenu",e=>{ if(e.target.closest("li[data-id]")) e.preventDefault(); });
listEl.addEventListener("keydown",e=>{
  if(e.target.id!=="renameInput") return;
  if(e.key==="Enter"){ e.preventDefault(); saveRename(); }
  if(e.key==="Escape"){ e.preventDefault(); cancelRename(); }
});
listEl.addEventListener("focusout",e=>{
  if(e.target.id==="renameInput" && editing){
    // vent litt, så et trykk på «Lagre» rekker å registreres
    setTimeout(()=>{ if(editing && document.activeElement?.id!=="renameInput") saveRename(); },120);
  }
});

// ---------- Del / send på e-post ----------
const LS_MAIL="handleliste.mailto.v1";
function shareText(includeDone){
  const list=Object.values(items).filter(it=>it&&it.name&&(includeDone||!it.done));
  const d=new Date().toLocaleDateString("no-NO",{weekday:"long",day:"numeric",month:"long"});
  let t=`Handleliste – ${d}\n`;
  const byCat={};
  for(const it of list){ const c=normCat(it.cat); (byCat[c]=byCat[c]||[]).push(it); }
  for(const c of CAT_ORDER){
    if(!byCat[c]) continue;
    byCat[c].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    t+=`\n${(CAT_LABEL[c]||"").replace(/^\S+\s/,"").toUpperCase()}\n`;
    for(const it of byCat[c]){
      const q=(it.qty||"").trim(); const qq=/^\d+([.,]\d+)?$/.test(q)?q+" stk":q;
      t+=`- ${it.name}${qq?` – ${qq}`:""}\n`;
    }
  }
  t+=`\nTotalt ${list.length} ${list.length===1?"vare":"varer"}.\n`;
  return t;
}
function openShare(){
  const to=lsGet(LS_MAIL,"");
  const anyDone=Object.values(items).some(it=>it.done);
  document.getElementById("sheetTitle").textContent="Send lista";
  document.getElementById("sheetBody").innerHTML=`
    <h4>Til (e-post)</h4>
    <input class="field" id="mailTo" type="email" inputmode="email" autocomplete="email" placeholder="kjopmann@butikk.no" value="${esc(to)}">
    <h4>Emne</h4>
    <input class="field" id="mailSubj" value="Handleliste">
    ${anyDone?`<label class="chk"><input type="checkbox" id="inclDone"> Ta med varer som er krysset av</label>`:""}
    <h4>Melding</h4>
    <textarea class="field" id="mailBody">${esc(shareText(false))}</textarea>
    <a class="bigbtn primary" id="mailGo" href="#">✉️ Åpne i e-post</a>
    ${navigator.share?`<button class="bigbtn secondary" id="shareGo" type="button">Del med en annen app…</button>`:""}
    <button class="bigbtn secondary" id="copyGo" type="button">Kopier teksten</button>
    <p>E-postappen åpnes med alt ferdig utfylt – du trykker bare «Send». Adressen huskes til neste gang.</p>`;
  const $=id=>document.getElementById(id);
  const inc=$("inclDone"); if(inc) inc.onchange=()=>{ $("mailBody").value=shareText(inc.checked); };
  $("mailTo").onchange=()=>lsSet(LS_MAIL,$("mailTo").value.trim());
  $("mailGo").onclick=e=>{
    const to=$("mailTo").value.trim(); lsSet(LS_MAIL,to);
    e.currentTarget.href=`mailto:${encodeURIComponent(to).replace(/%40/g,"@")}?subject=${encodeURIComponent($("mailSubj").value)}&body=${encodeURIComponent($("mailBody").value)}`;
  };
  const sg=$("shareGo"); if(sg) sg.onclick=async()=>{
    try{ await navigator.share({title:$("mailSubj").value,text:$("mailBody").value}); }catch(e){}
  };
  $("copyGo").onclick=async()=>{
    try{ await navigator.clipboard.writeText($("mailBody").value); showToast("Kopiert",false); }
    catch(e){ $("mailBody").select(); showToast("Merk teksten og kopier",false); }
  };
  document.getElementById("sheetBg").hidden=false;
}
function renderShareBtn(){
  document.getElementById("shareBtn").hidden = !Object.keys(items).length;
}
document.getElementById("shareBtn").addEventListener("click",openShare);

// ---------- Plass til status- og navigasjonslinjen ----------
(function(){
  const probe=document.createElement("div");
  probe.style.cssText="position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
  document.body.appendChild(probe);
  const fit=()=>{
    const cs=getComputedStyle(probe);
    const envTop=parseFloat(cs.paddingTop)||0, envBot=parseFloat(cs.paddingBottom)||0;
    const standalone=matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
    // Fyller vinduet hele skjermhøyden, ligger appen under systemlinjene
    const fullscreen=window.innerHeight >= screen.height - 4;
    const root=document.documentElement.style;
    root.setProperty("--fbt", standalone&&fullscreen&&envTop===0 ? "28px" : "0px");
    root.setProperty("--fbb", standalone&&fullscreen&&envBot===0 ? "48px" : "0px");
  };
  fit();
  window.addEventListener("orientationchange",()=>setTimeout(fit,300));
})();

// ---------- Plass til skrivefeltet nederst ----------
(function(){
  const bar=document.querySelector(".bar"), wrap=document.querySelector(".wrap");
  const fit=()=>{ wrap.style.paddingBottom=(bar.offsetHeight+24)+"px"; };
  try{ new ResizeObserver(fit).observe(bar); }catch(e){ window.addEventListener("resize",fit); }
  fit();
})();

// ---------- Oppstart ----------
items = lsGet(LS_ITEMS,{});
render();

const APP_VERSION="10";
if("serviceWorker" in navigator){
  // Last siden på nytt én gang når en ny versjon tar over
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadController&&!reloaded){ reloaded=true; location.reload(); } });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); });
    }).catch(()=>{});
  });
}
document.getElementById("ver").textContent="Versjon "+APP_VERSION;
</script>
